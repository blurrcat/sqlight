name = "sqlight"
version = "1.1.0"
licences = ["Apache-2.0"]
description = "Use SQLite from Gleam!"

gleam = ">= 1.3.0"

repository = { type = "github", user = "lpil", repo = "sqlight" }
links = [
    { title = "Website", href = "https://gleam.run" },
    { title = "Sponsor", href = "https://github.com/sponsors/lpil" },
]

[javascript]
runtime = "deno"

[javascript.deno]
allow_read = ["gleam.toml", "test", "build", "tmp"]
allow_write = ["tmp"]

[dependencies]
gleam_stdlib = ">= 0.51.0 and < 2.0.0"
esqlite = { git = "https://github.com/blurrcat/esqlite", ref = "33d6a5f1cdc507c0ffdd28e5f0a2a32766c2973c" }

[dev-dependencies]
gleeunit = "~> 1.0"
